name: Validación WebScope
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  guided-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_workflow_ui.py
      - run: python scripts/test_streamlined_pipeline_ui.py
      - run: python scripts/test_download_recovery_ui.py
      - run: python scripts/test_acquisition_ui.py
      - run: python scripts/test_shared_acquisition_ui.py
      - run: python scripts/test_search_clarity_ui.py
      - run: python scripts/test_import_ui.py
      - run: python scripts/test_explainability_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-ui-validation
          path: |
            runtime/guided-ui-validation/
            runtime/streamlined-pipeline-ui-validation/
            runtime/download-recovery-ui-validation/
            runtime/acquisition-ui-validation/
            runtime/shared-acquisition-ui-validation/
            runtime/search-clarity-ui-validation/
            runtime/import-ui-validation/
            runtime/ui-validation/
  unit:
    timeout-minutes: 20
    strategy:
      # Preserve complete platform diagnostics when one matrix member fails.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests with diagnostic watchdog
        run: >-
          python -u -c "import faulthandler, unittest;
          faulthandler.dump_traceback_later(180, repeat=True);
          tests = unittest.defaultTestLoader.discover('tests');
          assert tests.countTestCases() > 0, 'No tests discovered';
          result = unittest.TextTestRunner(verbosity=2).run(tests);
          faulthandler.cancel_dump_traceback_later();
          raise SystemExit(not result.wasSuccessful())"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir runtime/wheels .
      - name: Create isolated wheel environment
        run: python -m venv runtime/wheel-env
      - name: Install and validate wheel (Linux)
        if: runner.os != 'Windows'
        run: |
          runtime/wheel-env/bin/python -m pip install --no-index --no-deps --find-links runtime/wheels peps-mx
          runtime/wheel-env/bin/python -I scripts/validate_distribution.py --output runtime/ci-wheel-validation.json
      - name: Install and validate wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          runtime/wheel-env/Scripts/python.exe -m pip install --no-index --no-deps --find-links runtime/wheels peps-mx
          runtime/wheel-env/Scripts/python.exe -I scripts/validate_distribution.py --output runtime/ci-wheel-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: |
            runtime/ci-wheel-validation.json
  windows-portable:
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.lock.txt
      # needs: unit already validates this commit on Windows/Linux and Python 3.10/3.12.
      - run: ./scripts/build_windows.ps1 -Destination runtime/windows-dist -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: WebScope-windows-portable
          path: |
            runtime/windows-dist/WebScope/
            runtime/windows-dist/windows-distribution-validation.json
  nlp-optional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-nlp.lock.txt
      - run: python scripts/setup_local_nlp.py --download --install
      - run: python -m unittest discover -s tests -p test_advanced_nlp.py -v
      - run: python -m unittest discover -s tests -p test_contextual.py -v
