[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peps-mx"
version = "2.9.1"
description = "WebScope: herramienta local de web scraping y análisis documental auditable"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
peps = "peps.cli:main"
webscope = "peps.cli:main"

[tool.setuptools.packages.find]
include = ["peps*"]

[tool.setuptools.package-data]
peps = ["web/*", "web/fonts/*.woff2", "defaults/*.json", "models/*.json", "licenses/*.txt"]
